name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dispatch-plugin-pr-${{ github.event.pull_request.number }}
          path: dist/plugin_package.zip
          retention-days: 14
          if-no-files-found: error

  # D-09: a committed secret fails the build. It is always real and always actionable,
  # so this job carries no continue-on-error at either level.
  #
  # Scoped to pull_request deliberately. The composite action derives its scan range from the
  # event payload: on a push it evaluates COMMIT_LENGTH=$(printenv COMMIT_IDS | jq length)
  # over github.event.commits and, when that is 0, prints "No commits to scan" and exits 0
  # BEFORE scanning anything — the same short-circuit release.yml documents at length above its
  # own Secret scan step. Even a non-empty array is truncated by GitHub to 20 entries, so a
  # larger push would leave its earliest commits outside the range. Left unguarded, this job
  # would render a green check on the push path having scanned nothing, or only part of it.
  #
  # push coverage: the secret-scan-push job below. It runs the same pinned scanner as a
  # container over full committed history, which has no event payload to short-circuit on, so
  # between the two jobs every commit that reaches main is scanned by one or the other. Both
  # block. release.yml then re-scans full history with --fail before anything is signed.
  secret-scan:
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Mandatory, not defensive, and full history is required regardless of trigger —
          # for a different reason on each, which is why this note now covers both rather
          # than only the one this job runs on. On pull_request (this job) the action
          # resolves BASE and HEAD from the event payload and runs `trufflehog git
          # file:///tmp/ --since-commit $BASE --branch $HEAD`; neither commit exists in a
          # depth-1 clone, and the action hard-fails with "BASE and HEAD commits are the
          # same" when they resolve identically. On push (secret-scan-push below) the history
          # IS the scan range, so a depth-1 clone would silently narrow a full-history scan
          # to a single commit and still exit 0.
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          # The action ref pins only the wrapper. The wrapper `docker run`s
          # ghcr.io/trufflesecurity/trufflehog:${VERSION} and this input defaults to "latest",
          # so omitting it leaves the scanner itself unpinned. No leading "v": the container
          # tag 3.94.3 returns HTTP 200 from ghcr while v3.94.3 returns 404.
          version: 3.94.3
          # The unverified class is kept deliberately. TruffleHog sorts every detection into
          # verified (live verification succeeded), unknown (verification was attempted and
          # errored) and unverified (verification ran and returned negative, or the detector
          # has no verifier), and --fail fires only on what survives this filter.
          #
          # This repository's one named secret is the release signing key, and a self-signed
          # PEM is registered nowhere, so the privatekey detector returns a clean negative and
          # the finding lands in unverified. The narrower filter that used to sit here dropped
          # that class, which meant committing private.pem passed every secret gate in this
          # repository — measured, not reasoned: against a throwaway repo whose history carries
          # a generated key, the old filter exited 0 and this one exits 183.
          #
          # Noise is handled by detector name with --exclude-detectors, never by discarding a
          # class. None is excluded today because none was found: scanning this repository's
          # full committed history with this filter emitted zero detections across 715 chunks
          # and 539986 bytes, so keeping the class costs nothing to triage.
          extra_args: --results=verified,unverified,unknown

  # push coverage: the other half of the split above, and the reason the guard on secret-scan
  # is a scoping decision rather than a hole. Pushing straight to main is this repository's
  # primary workflow — all 21 commits of this phase landed that way, with no merge commit
  # among them — so delegating push coverage to the release gate would have left the secret
  # gate effectively unexercised until the next tag, on the one path that actually gets used.
  #
  # Runs the pinned CLI container instead of the composite action, for precisely the reason
  # release.yml gives above its own Secret scan step: that action short-circuits on a push
  # event before scanning, and this job's only trigger IS a push. `git file:///repo` reads
  # committed history only, so the untracked, gitignored private.pem / public.pem at the repo
  # root are never scanned.
  #
  # The invocation is kept byte-identical to the release-path one on purpose — this job is
  # that step's canary. release.yml's Secret scan has never executed anywhere (no Docker
  # daemon on the development machine) and its one known first-run failure is git's ownership
  # check against the root-owned bind mount. If that fires it now fires here, on a push, where
  # the fix is cheap, rather than mid-release on a path that signs an immutable artifact. The
  # remedy is recorded verbatim in release.yml above that step; apply it to both invocations
  # together so the two cannot drift.
  #
  # Blocking, like its sibling: D-09 makes no exception for the push path. A secret already
  # pushed to a public repository cannot be un-pushed by a red check, but the red check is
  # what makes it actionable within minutes instead of at the next release.
  secret-scan-push:
    name: Secret scan (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Here the history is the scan range itself — see the sibling job's note above.
          fetch-depth: 0

      # The result filter keeps the unverified class on purpose: a self-signed PEM verifies
      # negative and would otherwise be dropped without ever reaching --fail. Full reasoning
      # sits above secret-scan's extra_args. Keep the two in step — see the byte-identity note
      # above.
      - name: TruffleHog
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            ghcr.io/trufflesecurity/trufflehog:3.94.3 \
            git file:///repo \
            --results=verified,unverified,unknown \
            --fail --no-update --github-actions

  # D-09: dependency CVEs are reported but never fail the job. A transitive CVE frequently has
  # no available patch and may not be reachable, so blocking here would stop an urgent fix from
  # shipping. D-10 keeps this off the release path for the same reason.
  #
  # "Reported" means the run summary, not the log. Until this step existed the only record of a
  # finding was stdout inside a passing job — a green check that had reported nothing, which is
  # the failure this phase exists to eliminate. The scanner now writes a markdown table to
  # osv-results.md and the step below appends it to $GITHUB_STEP_SUMMARY, so a CVE is visible on
  # the run page without opening the job log.
  #
  # SARIF was the alternative and was rejected on three counts: it needs security-events: write
  # on a repository that signs releases, it adds a third-party action to pin, and it would file
  # the 34 advisories known today — all dev-tooling transitives, several reached through vitest
  # itself — as permanent code-scanning alerts that each need dismissing.
  dependency-scan:
    name: Dependency CVEs (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Default depth 1 is correct here: osv-scanner reads pnpm-lock.yaml and needs no history.
      # No pnpm install either — installing would make it walk node_modules instead.
      - name: Checkout
        uses: actions/checkout@v4

      - name: OSV-Scanner
        # The id exists so the reporting step can read this step's outcome. Without it,
        # continue-on-error below leaves no way to distinguish a clean scan from a scanner
        # that opened its output writer and then died, and the summary called the second one
        # a clean bill of health.
        id: osv
        # Step level, never job level: continue-on-error is unsupported on a job that calls a
        # reusable workflow via `uses:`, so the reusable-workflow variant would silently lose
        # D-09's advisory intent and turn this into a blocking gate.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.5
        with:
          # --output/--format first, then the scan target: the argument order google's own
          # osv-scanner-reusable.yml uses at this same ref, and what makes --output land in the
          # workspace where the next step can read it back.
          #
          # There is no --skip-git here, and that is a measured decision rather than a dropped
          # default. The flag was REMOVED in osv-scanner v2 — the migration guide at v2.3.5
          # reads "--skip-git flag removed, replaced with --include-git-root" — and git-root
          # scanning is off by default in v2, so the behaviour that flag used to buy is what
          # this invocation already gets. Passing it would abort the scanner on an unknown flag,
          # which the continue-on-error above would swallow into a green job that scanned
          # nothing. `--recursive ./` is byte-identical to this action's own default scan-args
          # at the pinned version, so nothing about what gets scanned diverges from the default.
          scan-args: |-
            --format=markdown
            --output=osv-results.md
            --recursive
            ./

      # if: always() is mandatory, not decorative. The scanner exits non-zero when it finds a
      # CVE, so without it this step would be skipped on exactly the runs that have something
      # to report. It carries no continue-on-error of its own: a findings sink that fails
      # silently is how WR-03 happened, so if this cannot report, the job should go red.
      - name: Publish findings to the run summary
        if: always()
        env:
          # osv-scanner exits 0 for "no vulnerabilities", 1 for "vulnerabilities found" and
          # anything higher for an error. continue-on-error on the scanner step hides all
          # three, so the outcome is carried through explicitly: an existing but empty results
          # file is otherwise indistinguishable from a scanner that opened its writer and then
          # died, and this step used to report that case as clean.
          #
          # outcome, not conclusion: conclusion is what continue-on-error rewrote to success,
          # which is the value that cannot tell the two cases apart. Note a findings run also
          # reports failure here, which is why only the empty-file branch consults it.
          OSV_OUTCOME: ${{ steps.osv.outcome }}
        run: |
          if [[ ! -f osv-results.md ]]; then
            echo "::warning::OSV-Scanner wrote no results file — this run reported nothing."
          elif [[ ! -s osv-results.md && "$OSV_OUTCOME" != "success" ]]; then
            echo "::warning::OSV-Scanner wrote an empty results file and exited with outcome ${OSV_OUTCOME:-unset} — this run reported nothing."
          fi
          {
            echo "## Dependency CVEs (advisory)"
            echo
            if [[ -s osv-results.md ]]; then
              # Bounded on purpose: a step summary over 1 MiB fails the step, and a failing
              # step here would turn this advisory job into a blocking one, which is the one
              # thing D-09 forbids.
              head -c 512000 osv-results.md
              echo
              # The bound cuts mid-row and says nothing, so a reader of a large summary sees a
              # table that simply stops with no way to know findings were dropped.
              if [[ $(wc -c < osv-results.md) -gt 512000 ]]; then
                echo "_… truncated at 512 KB; see the scanner step log for the full table._"
                echo
              fi
              echo "_Advisory only. This job does not fail on a finding (D-09): a transitive"
              echo "CVE often has no available patch, and blocking would stop an urgent fix._"
            elif [[ -f osv-results.md && "$OSV_OUTCOME" == "success" ]]; then
              echo "No known vulnerabilities in pnpm-lock.yaml."
            elif [[ ! -f osv-results.md ]]; then
              echo "> [!WARNING]"
              echo "> OSV-Scanner wrote no results file (outcome: ${OSV_OUTCOME:-unset}), so it"
              echo "> failed before reporting."
              echo "> **This run reported nothing** — do not read the green check as a clean"
              echo "> bill of health. Open the scanner step's log to see why it exited."
            else
              echo "> [!WARNING]"
              echo "> OSV-Scanner wrote an empty results file but did not exit cleanly"
              echo "> (outcome: ${OSV_OUTCOME:-unset}). The output writer is opened before the"
              echo "> scan begins, so an empty file is what a scanner that died mid-scan leaves"
              echo "> behind — it cannot be read as a clean scan."
              echo "> **This run reported nothing** — do not read the green check as a clean"
              echo "> bill of health. Open the scanner step's log to see why it exited."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
