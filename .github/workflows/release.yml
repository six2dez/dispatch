name: "Release"

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # D-10. Runs the pinned CLI container directly, and must keep doing so — do NOT
      # "simplify" this back to the composite GitHub Action. On a push event the action
      # evaluates COMMIT_LENGTH=$(printenv COMMIT_IDS | jq length) over
      # toJson(github.event.commits.*.id) and, when that is 0, prints "No commits to scan"
      # and exits 0 BEFORE running any scan. A tag creation has no before-to-after commit
      # range, so this workflow's own trigger is exactly the case that short-circuits; the
      # workflow_dispatch trigger takes a different branch of that script and does scan,
      # which is what hides the problem. This release is signed and immutable, so a gate
      # that goes green having scanned nothing cannot be retried after the fact.
      #
      # The image tag carries no leading "v": 3.94.3 returns HTTP 200 from ghcr, the
      # v-prefixed tag returns 404 and would fail at docker run with a manifest error.
      # Optional immutable pinning — append
      # @sha256:8837fd74692f6da826b51bc008b6bcf0dd2d70d31d06792673872a235d9b7e39.
      #
      # `git file:///repo`, not `filesystem /repo`: the git source sees only committed
      # history, so the untracked, gitignored private.pem / public.pem at the repo root are
      # never read. fetch-depth: 0 above is what makes that full history present.
      #
      # KNOWN UNKNOWN — this step could not be smoke-tested before its first real run (no
      # Docker daemon on the development machine), so a tag push is its first execution. The
      # one plausible first-run failure is git's ownership check: the container runs as root
      # against a bind mount owned by the runner's uid 1001, which can produce "detected
      # dubious ownership in repository at '/repo'". If that happens, add these to the
      # docker run invocation and re-run:
      #   -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
      # Deliberately not enabled pre-emptively: it widens what git will read, it has not been
      # observed to be needed, and the failure it guards against is loud and fires before
      # signing, never silent.
      #
      # The result filter keeps the unverified class on purpose: this repository's release
      # signing key is self-signed, so it verifies negative and the narrower filter that used
      # to sit here dropped it — the one artifact this gate exists to catch, on the one path
      # that signs something immutable. Full reasoning is above ci.yml's secret-scan step, and
      # this invocation is byte-identical to secret-scan-push's on purpose.
      - name: Secret scan
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            ghcr.io/trufflesecurity/trufflehog:3.94.3 \
            git file:///repo \
            --results=verified,unverified,unknown \
            --fail --no-update --github-actions

      - name: Resolve version
        id: meta
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Caido store requires the tag to equal the version with no "v" prefix.
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${MANIFEST_VERSION}"
              exit 1
            fi
            VERSION="${TAG_VERSION}"
          else
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              echo "::error::Manual release must run on main branch"
              exit 1
            fi
            VERSION="${MANIFEST_VERSION}"
          fi
          TAG="${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          {
            echo 'body<<CHANGELOG_EOF'
            awk -v v="${VERSION}" '
              /^## / {
                if (found) { exit }
                if ($0 ~ "^## " v "( |$)") { found=1; next }
              }
              found { print }
            ' CHANGELOG.md | sed -e :a -e '/./,$!d;/^\n*$/{$d;N;ba' -e '}'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Sign package
        working-directory: dist
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [[ -z "${PRIVATE_KEY}" ]]; then
            echo "::error::PRIVATE_KEY secret is missing — cannot sign release. Configure it under Settings → Secrets and re-run."
            exit 1
          fi
          printf '%s' "${PRIVATE_KEY}" > private_key.pem
          openssl pkeyutl -sign -inkey private_key.pem -out plugin_package.zip.sig -rawin -in plugin_package.zip
          openssl pkey -in private_key.pem -pubout -out public.pem
          rm -f private_key.pem

      - name: Create release
        uses: caido/action-release@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          artifacts: "dist/plugin_package.zip,dist/plugin_package.zip.sig,dist/public.pem"
          immutableCreate: true
          artifactErrorsFailBuild: true
