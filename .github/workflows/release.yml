name: "Release"

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Caido store requires the tag to equal the version with no "v" prefix.
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${MANIFEST_VERSION}"
              exit 1
            fi
            VERSION="${TAG_VERSION}"
          else
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              echo "::error::Manual release must run on main branch"
              exit 1
            fi
            VERSION="${MANIFEST_VERSION}"
          fi
          TAG="${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          {
            echo 'body<<CHANGELOG_EOF'
            awk -v v="${VERSION}" '
              /^## / {
                if (found) { exit }
                if ($0 ~ "^## " v "( |$)") { found=1; next }
              }
              found { print }
            ' CHANGELOG.md | sed -e :a -e '/./,$!d;/^\n*$/{$d;N;ba' -e '}'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build package
        run: pnpm build

      - name: Sign package
        working-directory: dist
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [[ -z "${PRIVATE_KEY}" ]]; then
            echo "::error::PRIVATE_KEY secret is missing — cannot sign release. Configure it under Settings → Secrets and re-run."
            exit 1
          fi
          printf '%s' "${PRIVATE_KEY}" > private_key.pem
          openssl pkeyutl -sign -inkey private_key.pem -out plugin_package.zip.sig -rawin -in plugin_package.zip
          openssl pkey -in private_key.pem -pubout -out public.pem
          rm -f private_key.pem

      - name: Create release
        uses: caido/action-release@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          artifacts: "dist/plugin_package.zip,dist/plugin_package.zip.sig,dist/public.pem"
          immutableCreate: true
          artifactErrorsFailBuild: true
