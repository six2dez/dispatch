name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Focus on the problem first — the
        "what" and "why". Implementation ideas are welcome but optional.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow that's painful or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. How could Dispatch address it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you're currently using or other tools that solve this.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This belongs in Dispatch (not Caido core or the downstream CLI tool itself)
          required: true
